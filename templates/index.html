<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Sentinel | DAST Dashboard</title>
    <style>
        :root {
            --bg-dark:#050810;--bg-panel:#0d1117;--primary:#00f5c4;
            --secondary:#58a6ff;--danger:#f85149;--warning:#d29922;
            --text-main:#c9d1d9;--text-muted:#8b949e;--border:#21262d;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{background:var(--bg-dark);color:var(--text-main);
             font-family:'Segoe UI',system-ui,sans-serif;
             display:flex;overflow:hidden}

        /* sidebar */
        .sidebar{width:300px;min-width:300px;background:var(--bg-panel);
            border-right:1px solid var(--border);padding:20px 16px;
            display:flex;flex-direction:column;gap:13px;overflow-y:auto}
        .logo{font-size:20px;font-weight:700;color:var(--primary);
            text-align:center;letter-spacing:2px;padding-bottom:8px;
            border-bottom:1px solid var(--border)}
        .field{display:flex;flex-direction:column;gap:4px}
        .field label{font-size:10px;color:var(--text-muted);
            text-transform:uppercase;letter-spacing:1px}
        .field input,.field select{background:var(--bg-dark);
            border:1px solid var(--border);color:var(--text-main);
            padding:8px 10px;border-radius:4px;outline:none;
            width:100%;font-size:13px}
        .field input:focus,.field select:focus{border-color:var(--primary)}
        .btn{background:var(--primary);color:var(--bg-dark);border:none;
            padding:10px;font-weight:700;font-size:13px;border-radius:4px;
            cursor:pointer;width:100%;transition:opacity .2s}
        .btn:hover{opacity:.82}
        .btn:disabled{background:var(--text-muted);cursor:not-allowed}
        .btn-sm{background:transparent;color:var(--primary);
            border:1px solid var(--primary);padding:4px 10px;
            font-size:11px;width:auto}
        .btn-sm:hover{background:rgba(0,245,196,.08);opacity:1}
        .badge{text-align:center;padding:8px;border-radius:4px;
            font-size:12px;font-weight:700;background:var(--bg-dark);
            border:1px solid var(--border);letter-spacing:1px}
        .badge.scanning{color:var(--primary);border-color:var(--primary);
            animation:pulse 2s infinite}
        .badge.done{color:var(--primary);border-color:var(--primary)}
        .badge.failed{color:var(--danger);border-color:var(--danger)}
        .badge.crawling,.badge.exploiting,.badge.aggregating,
        .badge.scoring,.badge.reporting,.badge.pending{
            color:var(--warning);border-color:var(--warning);
            animation:pulse 2s infinite}
        @keyframes pulse{
            0%,100%{box-shadow:0 0 0 0 rgba(0,245,196,.4)}
            70%{box-shadow:0 0 0 7px rgba(0,245,196,0)}}
        .prog-wrap{height:3px;background:var(--border);
            border-radius:2px;overflow:hidden}
        .prog-fill{height:100%;background:var(--primary);
            transition:width .5s ease;width:0}
        hr.sep{border:none;border-top:1px solid var(--border);margin:2px 0}
        .jobs-list{display:flex;flex-direction:column;gap:5px}
        .job-item{background:var(--bg-dark);border:1px solid var(--border);
            border-radius:4px;padding:7px 10px;cursor:pointer;
            transition:border-color .15s}
        .job-item:hover{border-color:var(--primary)}
        .ji-url{font-size:11px;color:var(--text-main);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .ji-meta{font-size:10px;color:var(--text-muted);
            margin-top:2px;display:flex;gap:8px}
        .ji-st{font-weight:700}
        .ji-st.done{color:var(--primary)}
        .ji-st.failed{color:var(--danger)}
        .ji-st.scanning,.ji-st.crawling,.ji-st.pending{color:var(--warning)}

        /* main */
        .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .tabs{display:flex;background:var(--bg-panel);
            border-bottom:1px solid var(--border);flex-shrink:0}
        .tab{padding:11px 20px;cursor:pointer;color:var(--text-muted);
            border-bottom:2px solid transparent;font-size:13px;
            user-select:none;transition:color .15s}
        .tab:hover{color:var(--text-main)}
        .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
        .panels{flex:1;overflow:hidden}
        .panel{display:none;height:100%;padding:16px;overflow-y:auto}
        .panel.active{display:block}

        /* console */
        #console{background:#000;border-radius:4px;padding:14px;
            height:calc(100% - 2px);overflow-y:auto;
            font-family:'Courier New',monospace;
            font-size:12.5px;line-height:1.55}
        .le{margin-bottom:1px;word-break:break-all}
        .lt{color:var(--text-muted)}
        .ls{color:var(--secondary);font-weight:700}
        .lm{color:#e6edf3}
        .le.level-error .lm{color:var(--danger)}
        .le.level-warning .lm{color:var(--warning)}

        /* findings */
        .tw{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:12.5px}
        th,td{text-align:left;padding:9px 11px;
            border-bottom:1px solid var(--border)}
        th{color:var(--text-muted);font-size:10px;text-transform:uppercase}
        .sc{color:var(--danger);font-weight:700}
        .sh{color:#ff7b72;font-weight:700}
        .sm{color:var(--warning)}
        .sl{color:var(--secondary)}
        .si{color:var(--text-muted)}
        .ev{max-width:220px;overflow:hidden;text-overflow:ellipsis;
            white-space:nowrap;font-family:monospace;font-size:11px;
            color:var(--text-muted);cursor:help}

        /* report */
        #rbox{background:var(--bg-panel);border-radius:4px;padding:20px;
            white-space:pre-wrap;font-family:'Courier New',monospace;
            font-size:13px;line-height:1.7;color:var(--text-main);
            min-height:200px}
        .empty{display:flex;justify-content:center;align-items:center;
            min-height:140px;color:var(--text-muted);font-size:14px}
        .pill{display:inline-block;font-size:10px;font-weight:700;
            padding:2px 7px;border-radius:10px;
            background:rgba(0,245,196,.12);color:var(--primary)}
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">SENTINEL</div>

    <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" value="test-key-123" placeholder="x-api-key">
    </div>
    <div class="field">
        <label>Target URL</label>
        <input type="text" id="targetUrl" placeholder="http://localhost:3000">
    </div>
    <div class="field">
        <label>Scan Tier</label>
        <select id="tier">
            <option value="Basic">Basic</option>
            <option value="Professional">Professional</option>
        </select>
    </div>

    <button class="btn" id="scanBtn" onclick="startScan()">Launch Scan</button>

    <div class="badge" id="badge">IDLE</div>
    <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>

    <div class="field">
        <label>Active Job ID</label>
        <input type="text" id="jobId" readonly placeholder="none">
    </div>

    <hr class="sep">

    <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px">Recent Jobs</span>
        <button class="btn btn-sm" onclick="loadJobs()">Refresh</button>
    </div>
    <div class="jobs-list" id="jobsList">
        <div style="font-size:12px;color:var(--text-muted)">Loading...</div>
    </div>
</aside>

<main class="main">
    <nav class="tabs">
        <div class="tab active" onclick="showTab(this,'console')">Console</div>
        <div class="tab" onclick="showTab(this,'findings')">
            Findings <span class="pill" id="fcount">0</span>
        </div>
        <div class="tab" onclick="showTab(this,'report')">AI Report</div>
    </nav>
    <div class="panels">
        <div class="panel active" id="panel-console">
            <div id="console"><div class="empty">Awaiting scan...</div></div>
        </div>
        <div class="panel" id="panel-findings">
            <div class="tw">
                <table>
                    <thead><tr>
                        <th>Severity</th><th>Type</th><th>Param</th>
                        <th>URL</th><th>Conf</th><th>Evidence</th>
                    </tr></thead>
                    <tbody id="ftbody">
                        <tr><td colspan="6" class="empty">No findings yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="panel" id="panel-report">
            <div id="rbox" class="empty">Report will appear here after scan completes.</div>
        </div>
    </div>
</main>

<script>
"use strict";
var _poll=null, _logCount=0, _activeJob=null;

function showTab(el,name){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
    el.classList.add('active');
    document.getElementById('panel-'+name).classList.add('active');
}

function setBadge(text,cls){
    var b=document.getElementById('badge');
    b.textContent=text.toUpperCase();
    b.className='badge '+(cls||'');
}

async function startScan(){
    var url=document.getElementById('targetUrl').value.trim();
    var apiKey=document.getElementById('apiKey').value.trim();
    var tier=document.getElementById('tier').value;
    var btn=document.getElementById('scanBtn');
    if(!url){alert('Please enter a target URL.');return;}

    btn.disabled=true; btn.textContent='Dispatching...';
    setBadge('CONNECTING','scanning');
    _logCount=0;
    document.getElementById('console').innerHTML='';
    document.getElementById('ftbody').innerHTML='<tr><td colspan="6" class="empty">Scanning...</td></tr>';
    document.getElementById('rbox').className='empty';
    document.getElementById('rbox').textContent='Waiting for pipeline...';
    document.getElementById('fcount').textContent='0';
    document.getElementById('prog').style.width='0%';
    if(_poll){clearInterval(_poll);_poll=null;}

    try{
        var res=await fetch('/scan',{
            method:'POST',
            headers:{'Content-Type':'application/json','x-api-key':apiKey},
            body:JSON.stringify({url:url,tier:tier})
        });
        if(!res.ok){
            var e=await res.json().catch(function(){return{};});
            throw new Error(e.detail||'HTTP '+res.status);
        }
        var data=await res.json();
        _activeJob=data.job_id;
        document.getElementById('jobId').value=_activeJob;
        setBadge('SCANNING','scanning');
        btn.textContent='Scan Running...';
        startPoll(_activeJob,apiKey);
        loadJobs();
    }catch(err){
        alert('Scan error: '+err.message);
        setBadge('ERROR','failed');
        btn.disabled=false; btn.textContent='Launch Scan';
    }
}

function startPoll(jobId,apiKey){
    _poll=setInterval(async function(){
        try{
            var res=await fetch('/api/status/'+jobId,{headers:{'x-api-key':apiKey}});
            if(!res.ok) return;
            var d=await res.json();
            var status=(d.status||'unknown').toLowerCase();
            setBadge(status,status);
            document.getElementById('prog').style.width=Math.min(d.progress||0,100)+'%';
            renderLogs(d.logs||[]);
            renderFindings(d.findings||[]);
            if(d.report&&d.report.content) renderReport(d.report.content);
            if(status==='done'||status==='failed'){
                clearInterval(_poll);_poll=null;
                var btn=document.getElementById('scanBtn');
                btn.disabled=false; btn.textContent='Launch Scan';
                if(status==='done'&&!(d.report&&d.report.content))
                    fetchReport(jobId,apiKey);
                loadJobs();
            }
        }catch(e){console.error('Poll error:',e);}
    },1500);
}

function renderLogs(logs){
    if(!Array.isArray(logs)||logs.length<=_logCount) return;
    var el=document.getElementById('console');
    if(_logCount===0) el.innerHTML='';
    var frag=document.createDocumentFragment();
    logs.slice(_logCount).forEach(function(log){
        _logCount++;
        var d=document.createElement('div');
        d.className='le level-'+(log.level||'info').toLowerCase();
        d.innerHTML=
            '<span class="lt">['+esc(log.time||'')+']</span> '+
            '<span class="ls">['+esc((log.stage||log.component||'LOG').toUpperCase())+']</span> '+
            '<span class="lm">'+esc(log.message||'')+'</span>';
        frag.appendChild(d);
    });
    el.appendChild(frag);
    el.scrollTop=el.scrollHeight;
}

function renderFindings(findings){
    document.getElementById('fcount').textContent=findings.length;
    var tb=document.getElementById('ftbody');
    if(!findings.length) return;
    tb.innerHTML='';
    findings.forEach(function(f){
        var sev=(f.severity||'info').toLowerCase();
        var conf=Math.round(((f.confidence_score!=null?f.confidence_score:f.confidence)||0)*100);
        var ev=f.evidence_snippet||f.evidence||'';
        var url=f.target_url||f.url||'-';
        var tr=document.createElement('tr');
        tr.innerHTML=
            '<td class="s'+sev.charAt(0)+'">'+esc(f.severity||'?')+'</td>'+
            '<td>'+esc(f.type||'Unknown')+'</td>'+
            '<td>'+esc(f.param||f.parameter||'-')+'</td>'+
            '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(url)+'">'+esc(url.length>50?url.slice(0,50)+'...':url)+'</td>'+
            '<td>'+conf+'%</td>'+
            '<td class="ev" title="'+esc(ev)+'">'+esc(ev)||'-'+'</td>';
        tb.appendChild(tr);
    });
}

function renderReport(content){
    var el=document.getElementById('rbox');
    el.className=''; el.textContent=content;
}

async function fetchReport(jobId,apiKey){
    try{
        var r=await fetch('/report/'+jobId,{headers:{'x-api-key':apiKey}});
        if(!r.ok) return;
        var rpt=await r.json();
        if(rpt&&rpt.content) renderReport(rpt.content);
    }catch(e){console.warn('report fetch:',e);}
}

async function loadJobs(){
    var el=document.getElementById('jobsList');
    var key=document.getElementById('apiKey').value.trim();
    try{
        var res=await fetch('/api/jobs',{headers:{'x-api-key':key}});
        if(!res.ok){
            el.innerHTML='<div style="font-size:12px;color:var(--danger)">Could not load jobs</div>';
            return;
        }
        var jobs=await res.json();
        if(!jobs.length){
            el.innerHTML='<div style="font-size:12px;color:var(--text-muted)">No jobs yet.</div>';
            return;
        }
        el.innerHTML='';
        jobs.forEach(function(j){
            var div=document.createElement('div');
            div.className='job-item';
            var st=(j.status||'?').toLowerCase();
            var ago=timeAgo(j.created_at);
            div.innerHTML=
                '<div class="ji-url">'+esc(j.target_url||j.id)+'</div>'+
                '<div class="ji-meta">'+
                  '<span class="ji-st '+st+'">'+st.toUpperCase()+'</span>'+
                  '<span>'+esc(j.tier||'Basic')+'</span>'+
                  '<span>'+ago+'</span>'+
                '</div>';
            div.onclick=function(){resumeJob(j.id);};
            el.appendChild(div);
        });
    }catch(e){
        el.innerHTML='<div style="font-size:12px;color:var(--danger)">Error loading jobs</div>';
    }
}

function resumeJob(jobId){
    var apiKey=document.getElementById('apiKey').value.trim();
    if(_poll){clearInterval(_poll);_poll=null;}
    _logCount=0; _activeJob=jobId;
    document.getElementById('jobId').value=jobId;
    document.getElementById('console').innerHTML='';
    document.getElementById('ftbody').innerHTML='<tr><td colspan="6" class="empty">Loading...</td></tr>';
    document.getElementById('rbox').className='empty';
    document.getElementById('rbox').textContent='Loading report...';
    document.getElementById('fcount').textContent='0';
    setBadge('LOADING','scanning');
    startPoll(jobId,apiKey);
}

function timeAgo(iso){
    if(!iso) return '';
    try{
        var s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
        if(s<60)   return s+'s ago';
        if(s<3600) return Math.floor(s/60)+'m ago';
        return Math.floor(s/3600)+'h ago';
    }catch(e){return '';}
}

function esc(s){
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadJobs();
</script>
</body>
</html>
