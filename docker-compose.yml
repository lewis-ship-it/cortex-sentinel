# docker-compose.yml

version: '3.8'

services:

  # 1. REDIS - The Central Nervous System
  redis:
    image: redis:8.0-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. API - The Gateway
  api:
    build: .
    container_name: sentinel_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # 3. SCANNER SPECIALIST - The "Eyes" (Active Scanning)
  # Replaces the old worker.py to prevent pipeline duplication
  scanner_specialist:
    build: .
    container_name: sentinel_scanner
    command: python workers/crawl_worker.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. AGGREGATOR SPECIALIST - The "Brain" (AI & Report Generation)
  aggregator_specialist:
    build: .
    container_name: sentinel_aggregator
    command: python workers/aggregation_worker.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # 5. DASHBOARD - The Control Center
  dashboard:
    build: .
    container_name: sentinel_dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    restart: always

networks:
  default:
    name: sentinel_network