# docker-compose.yml

version: '3.8'

services:

  # 1. REDIS
  redis:
    image: redis:8.0-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. API
  api:
    build: .
    container_name: sentinel_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # 3. WORKER  (fixed: was workers/worker.py, correct file is workers/workers.py)
  worker:
    build: .
    container_name: sentinel_worker
    command: python workers/workers.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. DASHBOARD  (fixed: was app/dashboard.py, correct entry point is app.py)
  dashboard:
    build: .
    container_name: sentinel_dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    restart: always