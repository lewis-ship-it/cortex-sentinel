name: Cortex Sentinel - Security Scan

on: [push, pull_request]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Elite Scanner
        run: |
          python main.py --url https://staging-app.example.com --output report.json
          
      - name: Enforce Security Guardrail
        run: python utils/ci_gate.py report.json